syntax = "proto3";

option go_package = "api/generation/users/v1/users;userpb";

import "google/protobuf/timestamp.proto";

message GetUserRequest {
  int64 id = 1;
}

message GetUserResponse {   
  int64 id = 1;
  string login = 2;
  string email = 3;
  bool email_access = 4;
  int32 role = 5;
  bool is_deleted = 6;
  optional google.protobuf.Timestamp deleted_at = 7;

  optional int32 block_type_id = 8;
  optional bool forever_flag = 9;

  optional google.protobuf.Timestamp unblock_date = 10;

  optional string block_title = 11;
  optional string block_description = 12;
}

service UserProfileService {
  rpc GetUserById(GetUserRequest) returns (GetUserResponse);
}